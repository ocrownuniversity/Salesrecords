<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Sales &amp; Purchase Record</title>
<style>
:root{--bg:#f1f5f4;--card:#fff;--tx:#10231f;--mut:#5d716c;--pri:#0f766e;--bd:#d5e0de;--sale:#15803d;--buy:#c2410c;--in:#f8fbfa}
[data-theme=dark]{--bg:#0d1514;--card:#16211f;--tx:#e6f1ee;--mut:#9ab0ab;--pri:#2dd4bf;--bd:#2a3a37;--sale:#4ade80;--buy:#fb923c;--in:#0f1a18}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff}
[data-theme=dark] header{background:#134e4a;color:#e6f1ee}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
.top h1{font-size:18px;margin:0}
.top button{background:rgba(255,255,255,.18);border:0;color:inherit;border-radius:8px;padding:8px 12px;cursor:pointer}
nav{display:flex;overflow-x:auto;gap:4px;padding:0 8px 8px;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;background:rgba(255,255,255,.12);color:inherit;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{background:#fff;color:#0f766e}
main{max-width:1100px;margin:0 auto;padding:14px}
section{display:none}section.on{display:block}
h2{margin:6px 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.cols{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
label{display:block;font-size:13px;color:var(--mut);font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri)}
.tot{font-weight:800;font-size:20px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:flex-end}
.row>label{flex:1 1 150px}
.btn{padding:13px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:700;font-size:16px}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
[data-theme=dark] .btn.pri{color:#06201c}
.btn.red{background:#b91c1c;color:#fff;border-color:#b91c1c}
.line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--bd)}
.line:last-child{border:0}
.sales h3,.sales .line b{color:var(--sale)}.buys h3,.buys .line b{color:var(--buy)}
.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--bd)}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--in);color:var(--mut);font-size:12px;text-transform:uppercase}
tfoot td{font-weight:800;background:var(--in)}
.empty{text-align:center;color:var(--mut);padding:20px}
.act{display:flex;gap:4px}
.sm{padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13px}
.sm.del{color:#b91c1c;border-color:#b91c1c}
.sum{display:flex;flex-wrap:wrap;gap:8px 24px;margin:12px 0;font-weight:700}
.mut{color:var(--mut);font-size:13px}
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
#lock .card{width:100%;max-width:340px;text-align:center}
#pin{text-align:center;font-size:30px;letter-spacing:14px;margin:14px 0}
.err{color:#b91c1c;min-height:22px;font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal .card{max-width:420px;width:100%;margin:0;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10231f;color:#fff;padding:12px 20px;border-radius:10px;display:none;z-index:60}
#printArea{display:none}
.big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.bc{border-radius:14px;padding:16px;color:#fff}.bc small{opacity:.9;font-weight:600}
.bc b{display:block;font-size:clamp(17px,5.2vw,28px);margin:4px 0;word-break:break-word}
.chart{display:flex;gap:6px;height:150px;margin-top:8px}
.cd{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.bars{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;width:100%}
.bars i{display:block;width:40%;max-width:22px;min-height:2px;border-radius:4px 4px 0 0}
.bs{background:var(--sale)}.bp{background:var(--buy)}
.cd small{font-size:11px;color:var(--mut);margin-top:4px;text-align:center}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media print{
body>*:not(#printArea){display:none!important}
#printArea{display:block!important;color:#000;background:#fff;padding:10px}
body{background:#fff}
#printArea *{color:#000!important;background:none!important}
#printArea .tw{overflow:visible;border:0}
#printArea table{font-size:10px;width:100%}
#printArea th,#printArea td{border:1px solid #999;white-space:normal;word-break:break-word;padding:4px}
@page{margin:10mm}
}
</style>
</head>
<body>
<div id="lock"><div class="card" id="lockbox">
<div style="font-size:42px">🔒</div><h2>Sales &amp; Purchase Record</h2>
<div class="mut">Enter your 4-digit PIN</div>
<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
<div class="err" id="pinerr"></div>
<button class="btn pri" style="width:100%" onclick="tryPin()">Unlock</button>
</div></div>

<div id="app" hidden>
<header><div class="top"><h1 id="bizname"></h1><div><button onclick="toggleTheme()" id="themebtn">🌙</button> <button onclick="lockApp()">🔒 Lock</button></div></div><nav id="nav"></nav></header>
<main>
<section id="p-dash"></section>
<section id="p-sales"></section>
<section id="p-purchases"></section>
<section id="p-shist"></section>
<section id="p-phist"></section>
<section id="p-reports"></section>
<section id="p-audit"></section>
<section id="p-settings"></section>
</main>
</div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="card" id="mbody"></div></div>
<datalist id="itemlist"></datalist>
<div id="toast"></div>
<div id="printArea"></div>

<script>
const $=s=>document.querySelector(s);
const K='sales_purchase_db_v1';
const PAY=['Cash','Transfer','POS','Credit','Other'];
const NAMES={daily:'Daily',weekly:'Weekly (Mon–Sun)',monthly:'Monthly',yearly:'Yearly',all:'All-time'};
const TL={sales:{one:'Sale',party:'Customer',h:'Sales'},purchases:{one:'Purchase',party:'Supplier',h:'Purchases'}};
const DEF={name:'My Business',address:'',phone:'',currency:'₦',pin:'1990',theme:'light',lastStaff:''};
let db=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(K))}catch(e){}
 d=d&&typeof d==='object'?d:{};
 return{sales:Array.isArray(d.sales)?d.sales:[],purchases:Array.isArray(d.purchases)?d.purchases:[],settings:Object.assign({},DEF,d.settings||{})}}
function save(){try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Could not save data (storage full or blocked). Please make a backup.')}}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(new Date());
const pd=s=>new Date(s+'T00:00:00');
const dd=s=>{const[y,m,d]=s.split('-');return d+'/'+m+'/'+y};
const money=n=>db.settings.currency+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2});
const total=l=>l.reduce((s,x)=>s+Math.round(x.total*100),0)/100;
const inR=(l,r)=>l.filter(x=>x.date>=r[0]&&x.date<=r[1]);
const sortL=(l,asc)=>[...l].sort((a,b)=>(asc?1:-1)*(a.date.localeCompare(b.date)||a.id.localeCompare(b.id)));
function getRange(p,ref,a,b){
 const d=pd(ref),y=d.getFullYear(),m=d.getMonth();
 if(p==='daily')return[ref,ref];
 if(p==='weekly'){const s=new Date(d);s.setDate(d.getDate()-((d.getDay()+6)%7));const e=new Date(s);e.setDate(s.getDate()+6);return[fmtD(s),fmtD(e)]}
 if(p==='monthly')return[fmtD(new Date(y,m,1)),fmtD(new Date(y,m+1,0))];
 if(p==='yearly')return[y+'-01-01',y+'-12-31'];
 if(p==='all')return['0000-00-00','9999-12-31'];
 return[a||'0000-00-00',b||'9999-12-31'];
}
function rangeText(p,r,a,b){
 if(p==='all')return'All time';
 if(p==='custom')return(a?dd(a):'Beginning')+' to '+(b?dd(b):'Latest');
 return r[0]===r[1]?dd(r[0]):dd(r[0])+' to '+dd(r[1]);
}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2200)}
function closeModal(){$('#modal').style.display='none'}
function openModal(h){$('#mbody').innerHTML=h;$('#modal').style.display='flex'}

/* ---------- PIN ---------- */
$('#pin').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'');if(e.target.value.length===4)tryPin()});
$('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});
function tryPin(){
 const v=$('#pin').value;
 if(v===String(db.settings.pin)){$('#pin').value='';$('#pinerr').textContent='';$('#lock').style.display='none';$('#app').hidden=false;refreshAll();nav('dash')}
 else{$('#pinerr').textContent='Incorrect PIN';$('#pin').value='';const b=$('#lockbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
}
function lockApp(){$('#app').hidden=true;$('#lock').style.display='flex';$('#printArea').innerHTML='';closeModal();$('#pin').focus()}

/* ---------- Theme / nav ---------- */
function applyTheme(){document.documentElement.dataset.theme=db.settings.theme;$('#themebtn').textContent=db.settings.theme==='dark'?'☀️':'🌙'}
function toggleTheme(){db.settings.theme=db.settings.theme==='dark'?'light':'dark';save();applyTheme()}
const PAGES=[['dash','🏠 Dashboard'],['sales','🛒 Record Sales'],['purchases','📦 Record Purchases'],['shist','📄 Sales History'],['phist','📑 Purchase History'],['reports','📊 Reports'],['audit','🔍 Audit'],['settings','⚙️ Settings']];
$('#nav').innerHTML=PAGES.map(p=>`<button data-p="${p[0]}" onclick="nav('${p[0]}')">${p[1]}</button>`).join('');
function nav(id){if(id==='sales'||id==='purchases')resetForm(id);show(id)}
function show(id){
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='p-'+id));
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));
 if(id==='settings')fillSettings();
 window.scrollTo(0,0);
}

/* ---------- Record forms ---------- */
function formHTML(t){
 const L=TL[t],q=t==='sales'?'Quantity':'Quantity purchased';
 return`<h2 id="${t}-title">Record ${L.one}</h2><div class="card"><div class="grid">
<label>Date<input type="date" id="${t}-date"></label>
<label>Item name<input id="${t}-item" list="itemlist" autocomplete="off"></label>
<label>${q}<input type="number" id="${t}-qty" min="0" step="any" inputmode="decimal"></label>
<label>Unit price<input type="number" id="${t}-price" min="0" step="any" inputmode="decimal"></label>
<label>Total amount (automatic)<input id="${t}-total" class="tot" readonly value="0.00"></label>
${t==='sales'?`<label>Payment method<select id="sales-pay">${PAY.map(p=>`<option>${p}</option>`).join('')}</select></label>`:`<label>Selling price per unit<input type="number" id="purchases-sell" min="0" step="any" inputmode="decimal"></label>
<label>Expected profit (automatic)<input id="purchases-exp" class="tot" readonly value="0.00"></label>`}
<label>${L.party} name (optional)<input id="${t}-party" autocomplete="off"></label>
<label>Recorded by (your name)<input id="${t}-by" autocomplete="off"></label>
<label>Description / Notes (optional)<textarea id="${t}-notes" rows="2"></textarea></label></div>
<input type="hidden" id="${t}-id">
<div class="row"><button class="btn pri" onclick="saveRec('${t}')">💾 Save ${L.one}</button><button class="btn" id="${t}-cancel" hidden onclick="cancelEdit('${t}')">Cancel</button></div></div>`;
}
function refreshItems(){$('#itemlist').innerHTML=[...new Set([...db.sales,...db.purchases].map(x=>x.item.trim()))].sort().map(n=>`<option value="${esc(n)}">`).join('')}
function autoPrice(t){
 if($('#'+t+'-id').value)return;
 const n=$('#'+t+'-item').value.trim().toLowerCase(),pe=$('#'+t+'-price'),se=$('#purchases-sell');
 if(!n)return;
 const same=x=>x.item.trim().toLowerCase()===n,lp=sortL(db.purchases.filter(same))[0];
 if(t==='sales'){
  if(pe.value!==''&&pe.dataset.auto!=='1')return;
  const ls=sortL(db.sales.filter(same))[0],v=lp&&lp.sell!=null?lp.sell:(ls?ls.price:null);
  if(v!=null){pe.value=v;pe.dataset.auto='1';calc(t)}
 }else if(lp){
  if(pe.value===''||pe.dataset.auto==='1'){pe.value=lp.price;pe.dataset.auto='1'}
  if(lp.sell!=null&&(se.value===''||se.dataset.auto==='1')){se.value=lp.sell;se.dataset.auto='1'}
  calc(t);
 }
}
function calc(t){
 const q=parseFloat($('#'+t+'-qty').value)||0,p=parseFloat($('#'+t+'-price').value)||0;
 $('#'+t+'-total').value=money(Math.round(q*p*100)/100);
 if(t==='purchases'){const sp=parseFloat($('#purchases-sell').value)||0;$('#purchases-exp').value=money(Math.round(q*(sp-p)*100)/100)}
}
function resetForm(t){
 ['item','qty','price','party','notes','id'].forEach(f=>$('#'+t+'-'+f).value='');
 $('#'+t+'-date').value=today();if(t==='sales')$('#sales-pay').value='Cash';else{$('#purchases-sell').value='';$('#purchases-sell').dataset.auto=''}$('#'+t+'-by').value=db.settings.lastStaff||'';$('#'+t+'-price').dataset.auto='';
 $('#'+t+'-title').textContent='Record '+TL[t].one;$('#'+t+'-cancel').hidden=true;calc(t);
}
function cancelEdit(t){resetForm(t);show(t==='sales'?'shist':'phist')}
function saveRec(t){
 const g=f=>$('#'+t+'-'+f).value.trim();
 const item=g('item'),qty=parseFloat(g('qty')),price=parseFloat(g('price')),date=g('date');
 if(!date)return alert('Please select a date.');
 if(!item)return alert('Please enter the item name.');
 if(!(qty>0))return alert('Please enter a valid quantity.');
 if(!g('by'))return alert('Please enter the name of the person recording this transaction.');
 if(!(price>=0)||g('price')==='')return alert('Please enter a valid unit price.');
 if(t==='purchases'&&(g('sell')===''||!(parseFloat(g('sell'))>=0)))return alert('Please enter the selling price per unit.');
 const rec={date,item,qty,price,total:Math.round(qty*price*100)/100,pay:t==='sales'?g('pay'):'',party:g('party'),by:g('by'),notes:g('notes')};
 if(t==='purchases')rec.sell=parseFloat(g('sell'));db.settings.lastStaff=rec.by;
 const id=g('id');
 if(id){const i=db[t].findIndex(x=>x.id===id);if(i>-1)db[t][i]=Object.assign({id},rec)}
 else db[t].push(Object.assign({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)},rec));
 save();refreshAll();resetForm(t);toast(id?'Record updated':'Record saved');
 if(id)show(t==='sales'?'shist':'phist');
}
function editRec(t,id){
 const x=db[t].find(r=>r.id===id);if(!x)return;
 $('#'+t+'-date').value=x.date;$('#'+t+'-item').value=x.item;$('#'+t+'-qty').value=x.qty;$('#'+t+'-price').value=x.price;
 if(t==='sales')$('#sales-pay').value=x.pay;else $('#purchases-sell').value=x.sell==null?'':x.sell;$('#'+t+'-party').value=x.party||'';$('#'+t+'-by').value=x.by||'';$('#'+t+'-notes').value=x.notes||'';$('#'+t+'-id').value=id;
 $('#'+t+'-title').textContent='Edit '+TL[t].one;$('#'+t+'-cancel').hidden=false;calc(t);show(t);
}
function delRec(t,id){
 if(!confirm('Delete this record? This cannot be undone.'))return;
 db[t]=db[t].filter(x=>x.id!==id);save();refreshAll();toast('Record deleted');
}
function viewRec(t,id){
 const x=db[t].find(r=>r.id===id);if(!x)return;
 const L=TL[t];
 openModal(`<h3>${L.one} details</h3>
<div class="line"><span>Date</span><b>${dd(x.date)}</b></div><div class="line"><span>Item</span><b>${esc(x.item)}</b></div>
<div class="line"><span>Quantity</span><b>${x.qty}</b></div><div class="line"><span>Unit price</span><b>${money(x.price)}</b></div>
<div class="line"><span>Total</span><b>${money(x.total)}</b></div>${t==='sales'?`<div class="line"><span>Payment</span><b>${esc(x.pay)}</b></div>`:`<div class="line"><span>Selling price</span><b>${x.sell==null?'-':money(x.sell)}</b></div>`}
<div class="line"><span>${L.party}</span><b>${esc(x.party)||'-'}</b></div><div class="line"><span>Recorded by</span><b>${esc(x.by)||'-'}</b></div><div class="line"><span>Notes</span><b>${esc(x.notes)||'-'}</b></div>
<div class="row"><button class="btn pri" onclick="closeModal()">Close</button></div>`);
}

/* ---------- Tables ---------- */
function tbl(l,t,act){
 const P=TL[t].party;
 return`<div class="tw"><table><thead><tr><th>S/N</th><th>Date</th><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th>${t==='sales'?'<th>Payment</th>':'<th>Selling price</th>'}<th>${P}</th><th>Recorded by</th>${act?'<th>Actions</th>':''}</tr></thead><tbody>${
 l.length?l.map((x,i)=>`<tr><td>${i+1}</td><td>${dd(x.date)}</td><td>${esc(x.item)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td><b>${money(x.total)}</b></td>${t==='sales'?`<td>${esc(x.pay)}</td>`:`<td>${x.sell==null?'-':money(x.sell)}</td>`}<td>${esc(x.party)}</td><td>${esc(x.by)}</td>${act?`<td class="act"><button class="sm" onclick="viewRec('${t}','${x.id}')">View</button><button class="sm" onclick="editRec('${t}','${x.id}')">Edit</button><button class="sm del" onclick="delRec('${t}','${x.id}')">Delete</button></td>`:''}</tr>`).join(''):`<tr><td colspan="10" class="empty">No records found</td></tr>`
 }</tbody>${l.length?`<tfoot><tr><td colspan="5">Total (${l.length} records)</td><td colspan="${act?5:4}">${money(total(l))}</td></tr></tfoot>`:''}</table></div>`;
}

/* ---------- Dashboard ---------- */
function renderDash(){
 const t0=today();
 const blk=(t,title,cls)=>`<div class="card ${cls}"><h3>${title}</h3>${[['Today','daily'],['This Week','weekly'],['This Month','monthly'],['This Year','yearly'],['All Time','all']].map(([n,k])=>`<div class="line"><span>${n}</span><b>${money(total(inR(db[t],getRange(k,t0))))}</b></div>`).join('')}</div>`;
 const rec=(t,title)=>{const l=sortL(db[t]).slice(0,5);return`<div class="card"><h3>${title}</h3>${l.length?l.map(x=>`<div class="line"><span>${esc(x.item)} <span class="mut">· ${dd(x.date)}</span></span><b>${money(x.total)}</b></div>`).join(''):'<div class="mut">No records yet</div>'}</div>`};
 const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(fmtD(d))}
 const sv=days.map(x=>total(inR(db.sales,[x,x]))),pv=days.map(x=>total(inR(db.purchases,[x,x]))),mx=Math.max(1,...sv,...pv),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 const sT=inR(db.sales,[t0,t0]),pT=inR(db.purchases,[t0,t0]);
 const big=`<div class="big"><div class="bc" style="background:#15803d"><small>TODAY'S SALES</small><b>${money(total(sT))}</b><small>${sT.length} record(s)</small></div><div class="bc" style="background:#c2410c"><small>TODAY'S PURCHASES</small><b>${money(total(pT))}</b><small>${pT.length} record(s)</small></div></div>`;
 const chart=`<div class="card"><h3>Last 7 days</h3><div class="chart">${days.map((x,i)=>`<div class="cd"><div class="bars"><i class="bs" style="height:${sv[i]/mx*100}%" title="Sales ${esc(money(sv[i]))}"></i><i class="bp" style="height:${pv[i]/mx*100}%" title="Purchases ${esc(money(pv[i]))}"></i></div><small>${DN[pd(x).getDay()]}<br>${x.slice(8)}/${x.slice(5,7)}</small></div>`).join('')}</div><div class="sum"><span style="color:var(--sale)">■ Sales: ${money(total(sv.map(v=>({total:v}))))}</span><span style="color:var(--buy)">■ Purchases: ${money(total(pv.map(v=>({total:v}))))}</span></div></div>`;
 $('#p-dash').innerHTML=`<h2>Dashboard</h2>${big}<div class="cols">${blk('sales','Sales Summary','sales')}${blk('purchases','Purchase Summary','buys')}</div>${chart}<div class="cols">${rec('sales','Recent Sales')}${rec('purchases','Recent Purchases')}</div>`;
}

function histHTML(t){
 const L=TL[t];
 return`<h2>${L.h} History</h2><div class="card"><div class="row" style="margin-top:0">
<label>Search item, ${L.party.toLowerCase()} or staff<input id="h-${t}-q" placeholder="Search..." oninput="renderHist('${t}')"></label>
<label>From<input type="date" id="h-${t}-a" onchange="renderHist('${t}')"></label>
<label>To<input type="date" id="h-${t}-b" onchange="renderHist('${t}')"></label></div>
<div class="row" style="margin-top:8px">
${t==='sales'?`<label>Payment method<select id="h-sales-m" onchange="renderHist('sales')"><option value="">All methods</option>${PAY.map(p=>`<option>${p}</option>`).join('')}</select></label>`:''}
<label>Recorded by<select id="h-${t}-s" onchange="renderHist('${t}')"></select></label>
<label>Sort by<select id="h-${t}-o" onchange="renderHist('${t}')"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="hi">Highest amount</option><option value="lo">Lowest amount</option></select></label></div>
<div class="row"><button class="btn" onclick="clearFilters('${t}')">Clear filters</button><button class="btn" onclick="printHist('${t}')">🖨 Print</button><button class="btn" onclick="csv('${t}',histList('${t}'))">⬇ CSV</button></div>
<div class="sum" id="h-${t}-sum"></div><div id="h-${t}-tbl"></div></div>`;
}
function histList(t){
 const q=$('#h-'+t+'-q').value.trim().toLowerCase(),a=$('#h-'+t+'-a').value,b=$('#h-'+t+'-b').value,pm=($('#h-'+t+'-m')||{}).value,st=$('#h-'+t+'-s').value,o=$('#h-'+t+'-o').value;
 let l=db[t].filter(x=>(!q||x.item.toLowerCase().includes(q)||(x.party||'').toLowerCase().includes(q)||(x.by||'').toLowerCase().includes(q))&&(!a||x.date>=a)&&(!b||x.date<=b)&&(!pm||x.pay===pm)&&(!st||(x.by||'').trim()===st));
 if(o==='hi')l.sort((x,y)=>y.total-x.total);else if(o==='lo')l.sort((x,y)=>x.total-y.total);else l=sortL(l,o==='old');
 return l;
}
function renderHist(t){
 const sel=$('#h-'+t+'-s'),cur=sel.value,names=[...new Set(db[t].map(x=>(x.by||'').trim()).filter(Boolean))].sort();
 sel.innerHTML='<option value="">All staff</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');sel.value=names.includes(cur)?cur:'';
 const l=histList(t),n=TL[t].h;
 $('#h-'+t+'-sum').innerHTML=`<span>Today's ${n.toLowerCase()}: ${money(total(inR(db[t],[today(),today()])))}</span><span>Selected total: ${money(total(l))}</span><span class="mut">${l.length} record(s)</span>`;
 $('#h-'+t+'-tbl').innerHTML=tbl(l,t,true);
}
function clearFilters(t){['q','a','b','m','s'].forEach(f=>{const e=$('#h-'+t+'-'+f);if(e)e.value=''});$('#h-'+t+'-o').value='new';renderHist(t)}
function printHist(t){
 const a=$('#h-'+t+'-a').value,b=$('#h-'+t+'-b').value,l=histList(t);
 printDoc(t,(a||b)?rangeText('custom',null,a,b):'All records',sortL(l,true));
}

/* ---------- Audit ---------- */
const rq=n=>Math.round(n*10000)/10000;
function auditHTML(){
 return`<h2>Audit</h2><div class="card"><div class="mut">Every registered item with quantities and amounts purchased and sold, remaining stock and profit for the chosen period.</div>
<div class="row"><label>Period<select id="a-period" onchange="renderAudit()"><option value="weekly">Weekly (Mon–Sun)</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option><option value="all">All-time</option><option value="daily">Daily</option><option value="custom">Custom date range</option></select></label>
<label id="a-refw">Reference date<input type="date" id="a-ref" onchange="renderAudit()"></label>
<label id="a-cf">From<input type="date" id="a-from" onchange="renderAudit()"></label>
<label id="a-ct">To<input type="date" id="a-to" onchange="renderAudit()"></label>
<label>Audited by (name)<input id="a-by" autocomplete="off"></label></div>
<div class="row"><button class="btn pri" onclick="printAudit()">🖨 Print audit</button><button class="btn" onclick="printAudit()">📄 Save as PDF</button><button class="btn" onclick="auditCSV()">⬇ CSV</button></div></div>
<div class="card"><div class="sum" id="a-sum"></div><div id="a-tbl"></div></div>`;
}
function auditData(){
 const p=$('#a-period').value,ref=$('#a-ref').value||today(),a=$('#a-from').value,b=$('#a-to').value,r=getRange(p,ref,a,b),end=r[1],m={};
 const get=x=>{const k=x.item.trim().toLowerCase();return m[k]||(m[k]={name:x.item.trim(),pq:0,pa:0,sq:0,sa:0,cpq:0,cpa:0,csq:0,sell:null,sd:''})};
 db.purchases.forEach(x=>{if(x.date>end)return;const o=get(x);o.cpq+=x.qty;o.cpa+=Math.round(x.total*100);if(x.sell!=null&&x.date>=o.sd){o.sell=x.sell;o.sd=x.date}if(x.date>=r[0]){o.pq+=x.qty;o.pa+=Math.round(x.total*100)}});
 db.sales.forEach(x=>{if(x.date>end)return;const o=get(x);o.csq+=x.qty;if(x.date>=r[0]){o.sq+=x.qty;o.sa+=Math.round(x.total*100)}});
 const rows=Object.values(m).sort((x,y)=>x.name.localeCompare(y.name)).map(o=>{
  const avg=o.cpq>0?o.cpa/o.cpq:0,rem=rq(o.cpq-o.csq);
  return{name:o.name,pq:rq(o.pq),pa:o.pa/100,sq:rq(o.sq),sa:o.sa/100,rem,sell:o.sell,
   profit:(o.cpq>0||o.sq===0)?Math.round(o.sa-o.sq*avg)/100:null,
   exp:rem<=0?0:(o.sell!=null&&o.cpq>0?Math.round(rem*(o.sell*100-avg))/100:null)};
 });
 const sum=k=>Math.round(rows.reduce((t,x)=>t+Math.round((x[k]||0)*100),0))/100;
 return{p,txt:rangeText(p,r,a,b),rows,pa:sum('pa'),sa:sum('sa'),profit:sum('profit'),exp:sum('exp')};
}
const neg=v=>v<0?' style="color:#b91c1c"':'';
function auditTbl(d){
 return`<div class="tw"><table><thead><tr><th>S/N</th><th>Item</th><th>Qty purchased</th><th>Purchase amount</th><th>Qty sold</th><th>Sales amount</th><th>Remaining stock</th><th>Selling price</th><th>Profit (sold)</th><th>Profit on remaining</th></tr></thead><tbody>${
 d.rows.length?d.rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.pq}</td><td>${money(x.pa)}</td><td>${x.sq}</td><td>${money(x.sa)}</td><td${neg(x.rem)}><b>${x.rem}</b></td><td>${x.sell==null?'-':money(x.sell)}</td><td${x.profit==null?'':neg(x.profit)}>${x.profit==null?'n/a':money(x.profit)}</td><td>${x.exp==null?'n/a':money(x.exp)}</td></tr>`).join(''):'<tr><td colspan="10" class="empty">No records found</td></tr>'
 }</tbody>${d.rows.length?`<tfoot><tr><td colspan="3">Total (${d.rows.length} items)</td><td>${money(d.pa)}</td><td></td><td>${money(d.sa)}</td><td></td><td></td><td>${money(d.profit)}</td><td>${money(d.exp)}</td></tr></tfoot>`:''}</table></div>`;
}
const AUDNOTE='Selling price = the price set on the latest purchase of the item. Remaining stock = all purchases minus all sales up to the end of the period. Profit (sold) = sales amount minus (quantity sold × average purchase price). Profit on remaining = remaining stock × (selling price − average purchase price). n/a = no purchase or selling price recorded.';
function renderAudit(){
 const d=auditData();
 $('#a-refw').hidden=d.p==='custom'||d.p==='all';$('#a-cf').hidden=$('#a-ct').hidden=d.p!=='custom';
 $('#a-sum').innerHTML=`<span>Period: ${d.txt}</span><span style="color:var(--buy)">Purchases: ${money(d.pa)}</span><span style="color:var(--sale)">Sales: ${money(d.sa)}</span><span>Profit (sold): ${money(d.profit)}</span><span>Profit on remaining: ${money(d.exp)}</span>`;
 $('#a-tbl').innerHTML=auditTbl(d)+`<p class="mut">${AUDNOTE}</p>`;
}
function printAudit(){
 const d=auditData(),s=db.settings,by=$('#a-by').value.trim();
 $('#printArea').innerHTML=`<div style="text-align:center"><h1 style="margin:0">${esc(s.name)} Audit Report</h1>${s.address?`<div>${esc(s.address)}</div>`:''}${s.phone?`<div>Tel: ${esc(s.phone)}</div>`:''}<div style="margin-top:6px">Period: ${esc(d.txt)}</div></div><br>${auditTbl(d)}
<p><b>Total purchases: ${money(d.pa)}</b><br><b>Total sales: ${money(d.sa)}</b><br><b>Profit (sold): ${money(d.profit)}</b><br><b>Profit on remaining stock: ${money(d.exp)}</b></p><p style="font-size:11px">${AUDNOTE}</p>
<p style="margin-top:30px">Audited by: ${esc(by)||'______________________'} &nbsp;&nbsp; Signature: ______________________ &nbsp;&nbsp; Date: ${dd(today())}</p>`;
 window.print();
}
function auditCSV(){
 const d=auditData(),c=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v)&&isNaN(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const rows=[['S/N','Item','Qty Purchased','Purchase Amount','Qty Sold','Sales Amount','Remaining Stock','Selling Price','Profit (Sold)','Profit On Remaining']];
 d.rows.forEach((x,i)=>rows.push([i+1,x.name,x.pq,x.pa,x.sq,x.sa,x.rem,x.sell==null?'':x.sell,x.profit==null?'n/a':x.profit,x.exp==null?'n/a':x.exp]));
 rows.push(['','TOTAL','',d.pa,'',d.sa,'','',d.profit,d.exp]);
 download('audit-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(c).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

/* ---------- Print / CSV ---------- */
function printDoc(t,period,l){
 const s=db.settings;
 $('#printArea').innerHTML=`<div style="text-align:center"><h1 style="margin:0">${esc(s.name)} ${TL[t].h} Report</h1>${s.address?`<div>${esc(s.address)}</div>`:''}${s.phone?`<div>Tel: ${esc(s.phone)}</div>`:''}
<div style="margin-top:6px">Period: ${esc(period)}</div></div><br>${tbl(l,t,false)}
<p><b>Total ${TL[t].h.toLowerCase()}: ${money(total(l))}</b> (${l.length} records)</p><div style="font-size:12px">Printed on ${dd(today())}</div>`;
 window.print();
}
function download(name,text,type){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function csv(t,l){
 const c=v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v)&&isNaN(v))v="'"+v;return'"'+v.replace(/"/g,'""')+'"'};
 const rows=[['S/N','Date','Item','Quantity','Unit Price','Total',t==='sales'?'Payment Method':'Selling Price',TL[t].party,'Recorded By','Notes']];
 sortL(l,true).forEach((x,i)=>rows.push([i+1,x.date,x.item,x.qty,x.price,x.total,t==='sales'?x.pay:x.sell,x.party,x.by,x.notes]));
 rows.push(['','','','','','TOTAL '+total(l),'','','','']);
 download(t+'-'+today()+'.csv','\ufeff'+rows.map(r=>r.map(c).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

/* ---------- Settings ---------- */
function settingsHTML(){
 return`<h2>Settings</h2>
<div class="card"><h3>Business details</h3><div class="grid">
<label>Business name<input id="s-name"></label><label>Business address (optional)<input id="s-addr"></label>
<label>Business phone (optional)<input id="s-phone" type="tel"></label>
<label>Currency<select id="s-cur"><option value="₦">Nigerian Naira ₦</option><option value="$">US Dollar $</option><option value="£">Pound £</option><option value="€">Euro €</option><option value="GH₵">Ghana Cedi GH₵</option><option value="KSh ">Kenya Shilling KSh</option><option value="R">Rand R</option></select></label></div>
<div class="row"><button class="btn pri" onclick="saveProfile()">Save settings</button></div></div>
<div class="card"><h3>Change access PIN</h3><div class="grid">
<label>Current PIN<input id="s-old" type="password" inputmode="numeric" maxlength="4"></label>
<label>New PIN (4 digits)<input id="s-new" type="password" inputmode="numeric" maxlength="4"></label>
<label>Confirm new PIN<input id="s-new2" type="password" inputmode="numeric" maxlength="4"></label></div>
<div class="row"><button class="btn pri" onclick="changePin()">Change PIN</button></div></div>
<div class="card"><h3>Database backup &amp; restore</h3><div class="mut">All data stays on this device. Back up regularly.</div>
<div class="row"><button class="btn pri" onclick="backup()">⬇ Backup database (JSON)</button></div>
<div class="row"><label>Restore from backup file<input type="file" id="s-file" accept=".json,application/json"></label><button class="btn" onclick="restore()">Restore</button></div></div>
<div class="card"><h3>Danger zone</h3><div class="mut">Permanently delete all sales and purchase records.</div>
<div class="row"><button class="btn red" onclick="clearAll()">Clear all records</button></div></div>`;
}
function fillSettings(){const s=db.settings;$('#s-name').value=s.name;$('#s-addr').value=s.address;$('#s-phone').value=s.phone;$('#s-cur').value=s.currency;['old','new','new2'].forEach(i=>$('#s-'+i).value='')}
function saveProfile(){
 const s=db.settings;s.name=$('#s-name').value.trim()||'My Business';s.address=$('#s-addr').value.trim();s.phone=$('#s-phone').value.trim();s.currency=$('#s-cur').value;
 save();refreshAll();toast('Settings saved');
}
function changePin(){
 const o=$('#s-old').value,n=$('#s-new').value,n2=$('#s-new2').value;
 if(o!==String(db.settings.pin))return alert('Current PIN is incorrect.');
 if(!/^\d{4}$/.test(n))return alert('New PIN must be exactly 4 digits.');
 if(n!==n2)return alert('New PINs do not match.');
 db.settings.pin=n;save();fillSettings();toast('PIN changed');
}
function backup(){
 const s=Object.assign({},db.settings);delete s.pin;
 download('sales-purchase-backup-'+today()+'.json',JSON.stringify({app:'sales-purchase-record',version:1,exported:new Date().toISOString(),sales:db.sales,purchases:db.purchases,settings:s},null,2),'application/json');
 toast('Backup downloaded');
}
function restore(){
 const f=$('#s-file').files[0];if(!f)return alert('Please choose a backup file first.');
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   const d=JSON.parse(fr.result);
   if(!d||!Array.isArray(d.sales)||!Array.isArray(d.purchases))throw 0;
   const clean=(l,k)=>l.filter(x=>x&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&x.item&&+x.qty>0&&+x.price>=0).map((x,i)=>({id:String(x.id||Date.now().toString(36)+i),date:x.date,item:String(x.item),qty:+x.qty,price:+x.price,total:Math.round(x.qty*x.price*100)/100,pay:k==='s'?(PAY.includes(x.pay)?x.pay:'Other'):'',sell:(x.sell!=null&&x.sell!==''&&+x.sell>=0)?+x.sell:null,party:String(x.party||''),by:String(x.by||''),notes:String(x.notes||'')}));
   const s=clean(d.sales,'s'),p=clean(d.purchases,'p');
   if(!confirm(`Restore ${s.length} sales and ${p.length} purchases? This will REPLACE all current records.`))return;
   const pin=db.settings.pin;db.sales=s;db.purchases=p;
   if(d.settings&&typeof d.settings==='object')db.settings=Object.assign({},DEF,d.settings,{pin});
   save();applyTheme();refreshAll();fillSettings();$('#s-file').value='';toast('Database restored');
  }catch(e){alert('Invalid backup file.')}
 };
 fr.readAsText(f);
}
function clearAll(){
 const p=prompt('Enter your PIN to delete ALL records:');
 if(p===null)return;
 if(p!==String(db.settings.pin))return alert('Incorrect PIN.');
 if(!confirm('This will permanently delete all sales and purchases. Continue?'))return;
 db.sales=[];db.purchases=[];save();refreshAll();toast('All records cleared');
}

/* ---------- Init ---------- */
function refreshAll(){
 $('#bizname').textContent=db.settings.name;document.title=db.settings.name+' – Sales & Purchases';
 ['sales','purchases'].forEach(calc);
 renderDash();renderHist('sales');renderHist('purchases');renderReports();renderAudit();refreshItems();
}
$('#p-sales').innerHTML=formHTML('sales');$('#p-purchases').innerHTML=formHTML('purchases');
$('#p-shist').innerHTML=histHTML('sales');$('#p-phist').innerHTML=histHTML('purchases');
$('#p-reports').innerHTML=reportsHTML();$('#p-audit').innerHTML=auditHTML();$('#p-settings').innerHTML=settingsHTML();
['sales','purchases'].forEach(t=>{['qty','price'].forEach(f=>$('#'+t+'-'+f).addEventListener('input',()=>calc(t)));$('#'+t+'-price').addEventListener('input',e=>e.target.dataset.auto='');['input','change'].forEach(ev=>$('#'+t+'-item').addEventListener(ev,()=>autoPrice(t)));resetForm(t)});
$('#purchases-sell').addEventListener('input',e=>{e.target.dataset.auto='';calc('purchases')});
$('#r-ref').value=today();$('#a-ref').value=today();
applyTheme();
</script>
